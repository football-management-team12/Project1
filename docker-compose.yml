services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false

    environment:
      DB_DRIVER: ${DB_DRIVER:-ODBC Driver 18 for SQL Server}
      DB_SERVER: ${DB_SERVER:-football-sql,1433}
      DB_NAME: ${DB_NAME:-FootballBookingDB}
      DB_USER: ${DB_USER:-ci_user}
      DB_PASSWORD: ${DB_PASSWORD:-ci_dummy_password}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-yes}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - football-network

networks:
  football-network:
    external: true
