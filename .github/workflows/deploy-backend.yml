name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend to VPS
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            set -eu

            cd /root/Project1

            echo "Fetching latest develop branch..."
            git fetch origin develop

            echo "Checking out the exact develop revision..."
            git checkout -B develop origin/develop

            echo "Building backend image..."
            docker compose build backend

            echo "Recreating only the backend service..."
            docker compose up -d --no-deps backend

            echo "Checking local API..."
            for i in $(seq 1 12); do
              if curl --fail --silent --show-error \
                --max-time 5 http://127.0.0.1:5000/; then
                echo
                echo "Backend deployment succeeded."
                exit 0
              fi

              echo "Backend not ready yet; retry $i/12..."
              sleep 5
            done

            echo "Backend health check failed."
            docker compose logs --tail=100 backend
            exit 1
