name: Deploy Backend

on:
  workflow_call:
    inputs:
      target_environment:
        description: Backend environment to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target_environment }} backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Deploy exact tested revision through SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          TARGET_ENV: ${{ inputs.target_environment }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_SHA,DEPLOY_BRANCH,TARGET_ENV
          command_timeout: 20m
          script: |
            set -eu
            cd /root/Project1

            case "$TARGET_ENV:$DEPLOY_BRANCH" in
              staging:develop)
                SERVICE="backend-staging"
                CONTAINER="backend-staging"
                ENV_FILE=".env.staging"
                EXPECTED_DB="FootballBookingDB"
                HOST_PORT="5000"
                IMAGE_TAG="football-booking-backend:staging-$DEPLOY_SHA"
                ROLLBACK_TAG="football-booking-backend:staging-rollback"
                STATE_FILE="/root/project1-config/deployment/staging-state"
                ;;
              production:main)
                SERVICE="backend-production"
                CONTAINER="backend-production"
                ENV_FILE=".env.production"
                EXPECTED_DB="FootballBookingDB_Production"
                HOST_PORT="5001"
                IMAGE_TAG="football-booking-backend:production-$DEPLOY_SHA"
                ROLLBACK_TAG="football-booking-backend:production-rollback"
                STATE_FILE="/root/project1-config/deployment/production-state"
                ;;
              *)
                echo "Rejected environment/branch combination: $TARGET_ENV:$DEPLOY_BRANCH"
                exit 1
                ;;
            esac

            printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[a-f0-9]{40}$' || {
              echo "Invalid deployment SHA."
              exit 1
            }

            mkdir -p /run/lock /root/project1-config/deployment
            exec 9>/run/lock/project1-backend-deploy.lock
            flock -n 9 || {
              echo "Another backend deployment is running."
              exit 1
            }

            [ -f "$ENV_FILE" ] && [ -f /root/project1-config/gmail_token.json ] || {
              echo "Required environment or Gmail token file is missing."
              exit 1
            }

            configured_db=$(awk -F= '$1=="DB_NAME" {count++; value=substr($0,index($0,"=")+1)} END {if(count==1) print value}' "$ENV_FILE")
            [ "$configured_db" = "$EXPECTED_DB" ] || {
              echo "Environment file database mismatch."
              exit 1
            }

            git fetch origin "$DEPLOY_BRANCH"
            latest_sha=$(git rev-parse FETCH_HEAD)
            if [ "$latest_sha" != "$DEPLOY_SHA" ]; then
              echo "Skipping stale deployment; branch has advanced."
              echo "Requested: $DEPLOY_SHA"
              echo "Latest:    $latest_sha"
              exit 0
            fi
            git cat-file -e "$DEPLOY_SHA^{commit}"

            [ "$(docker inspect "$CONTAINER" --format '{{.State.Running}}')" = "true" ] || {
              echo "Current backend container is not running."
              exit 1
            }

            current_image=$(docker inspect "$CONTAINER" --format '{{.Image}}')
            current_db=$(docker exec "$CONTAINER" printenv DB_NAME)
            [ "$current_db" = "$EXPECTED_DB" ] || {
              echo "Running container is connected to an unexpected database."
              exit 1
            }

            check_database() {
              docker exec -i "$CONTAINER" python - "$EXPECTED_DB" <<'PY_DB_CHECK'
            import sys
            from database import get_connection

            expected = sys.argv[1]
            conn = None
            try:
                conn = get_connection()
                if conn is None:
                    raise RuntimeError("Database connection unavailable")
                cursor = conn.cursor()
                cursor.execute("SELECT DB_NAME(), state_desc FROM sys.databases WHERE name = DB_NAME()")
                row = cursor.fetchone()
                if row is None or row[0] != expected or row[1] != "ONLINE":
                    raise RuntimeError("Connected database is not ONLINE or has the wrong name")
                print("Database check passed:", row[0], row[1])
            finally:
                if conn is not None:
                    conn.close()
            PY_DB_CHECK
            }

            verify_backend() {
              [ "$(docker exec "$CONTAINER" printenv DB_NAME 2>/dev/null || true)" = "$EXPECTED_DB" ] || return 1
              curl --fail --silent --max-time 8 "http://127.0.0.1:$HOST_PORT/ready" >/dev/null || return 1
              check_database
            }

            echo "Verifying current $TARGET_ENV backend before deployment..."
            verify_backend || {
              echo "Current backend is unhealthy; refusing deployment."
              exit 1
            }

            previous_commit="unknown-baseline"
            if [ -f "$STATE_FILE" ]; then
              state_image=$(awk -F= '$1=="CURRENT_IMAGE"{print substr($0,index($0,"=")+1)}' "$STATE_FILE")
              previous_commit=$(awk -F= '$1=="CURRENT_COMMIT"{print substr($0,index($0,"=")+1)}' "$STATE_FILE")
              [ "$state_image" = "$current_image" ] || {
                echo "Environment deployment state does not match the running container."
                exit 1
              }
            fi

            BUILD_DIR=$(mktemp -d /tmp/project1-backend-build.XXXXXX)
            OVERRIDE_FILE=$(mktemp /tmp/project1-compose-override.XXXXXX.yml)
            cleanup() {
              rm -rf "$BUILD_DIR"
              rm -f "$OVERRIDE_FILE"
            }
            trap cleanup EXIT

            mkdir -p "$BUILD_DIR"
            git archive "$DEPLOY_SHA" backend | tar -x -C "$BUILD_DIR"

            echo "Building immutable image $IMAGE_TAG..."
            docker build --pull=false --tag "$IMAGE_TAG" "$BUILD_DIR/backend"
            docker image tag "$current_image" "$ROLLBACK_TAG"

            write_override() {
              cat > "$OVERRIDE_FILE" <<EOF
            services:
              $SERVICE:
                image: $1
            EOF
            }

            compose_up() {
              docker compose -f docker-compose.yml -f "$OVERRIDE_FILE" up \
                --detach --no-deps --force-recreate --no-build "$SERVICE"
            }

            rollback() {
              echo "Attempting automatic $TARGET_ENV rollback..."
              write_override "$ROLLBACK_TAG"
              if ! compose_up; then
                echo "CRITICAL: Compose could not restore the previous backend."
                return 1
              fi
              for attempt in $(seq 1 18); do
                if verify_backend; then
                  echo "Previous backend restored and verified."
                  return 0
                fi
                sleep 5
              done
              echo "CRITICAL: Previous backend did not recover."
              return 1
            }

            write_override "$IMAGE_TAG"
            if ! compose_up; then
              rollback || echo "MANUAL INTERVENTION REQUIRED."
              exit 1
            fi

            ready=0
            for attempt in $(seq 1 18); do
              if verify_backend; then
                ready=1
                break
              fi
              sleep 5
            done

            if [ "$ready" -ne 1 ]; then
              docker compose -f docker-compose.yml -f "$OVERRIDE_FILE" logs --tail=60 "$SERVICE" || true
              rollback || echo "MANUAL INTERVENTION REQUIRED."
              exit 1
            fi

            new_image=$(docker inspect "$CONTAINER" --format '{{.Image}}')
            state_tmp=$(mktemp /root/project1-config/deployment/.state.XXXXXX)
            {
              printf 'CURRENT_IMAGE=%s\n' "$new_image"
              printf 'CURRENT_COMMIT=%s\n' "$DEPLOY_SHA"
              printf 'PREVIOUS_IMAGE=%s\n' "$current_image"
              printf 'PREVIOUS_COMMIT=%s\n' "$previous_commit"
            } > "$state_tmp"
            chmod 600 "$state_tmp"
            mv -f "$state_tmp" "$STATE_FILE"

            echo "======================================"
            echo "$TARGET_ENV DEPLOYMENT SUCCESS"
            echo "Commit: $DEPLOY_SHA"
            echo "Image:  $new_image"
            echo "State:  $STATE_FILE"
            echo "======================================"
