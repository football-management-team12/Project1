name: Deploy Backend

on:
  workflow_call:
    inputs:
      target_environment:
        description: Deployment target; this workflow currently permits Staging only.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested revision to Staging VPS
    if: inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy Staging through SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          TARGET_ENV: ${{ inputs.target_environment }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_SHA,DEPLOY_BRANCH,TARGET_ENV
          command_timeout: 15m
          script: |
            set -eu
            cd /root/Project1

            [ "$TARGET_ENV" = "staging" ] || {
              echo "Only Staging is permitted by this workflow."
              exit 1
            }
            [ "$DEPLOY_BRANCH" = "develop" ] || {
              echo "Staging must deploy from develop."
              exit 1
            }
            printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[a-f0-9]{40}$' || {
              echo "Invalid deployment commit SHA."
              exit 1
            }

            mkdir -p /run/lock /root/project1-config/deployment
            exec 9>/run/lock/project1-staging-deploy.lock
            flock -n 9 || {
              echo "Another Staging deployment is running."
              exit 1
            }

            CONFIG_DIR="/root/project1-config"
            ENV_FILE="$CONFIG_DIR/.env.staging"
            STATE_DIR="$CONFIG_DIR/deployment"
            STATE_FILE="$STATE_DIR/staging-state"
            SERVICE="backend-staging"
            CONTAINER="backend-staging"
            IMAGE_TAG="football-booking-backend:staging"
            CANDIDATE_TAG="football-booking-backend:staging-candidate-$DEPLOY_SHA"
            ROLLBACK_TAG="football-booking-backend:rollback-staging"
            EXPECTED_DB="FootballBookingDB"
            BUILD_DIR="$(mktemp -d /tmp/project1-staging-build.XXXXXX)"

            cleanup() {
              rm -rf "$BUILD_DIR"
            }
            trap cleanup EXIT

            [ -f "$ENV_FILE" ] && [ ! -L "$ENV_FILE" ] || {
              echo "Missing Staging environment file; deployment stopped."
              exit 1
            }

            db_name="$(grep -E '^DB_NAME=' "$ENV_FILE" | tail -n 1 | cut -d= -f2-)"
            [ "$db_name" = "$EXPECTED_DB" ] || {
              echo "Staging environment points to an unexpected database."
              exit 1
            }

            docker compose config --quiet
            docker inspect "$CONTAINER" >/dev/null 2>&1 || {
              echo "Staging container is not present."
              exit 1
            }

            previous_image="$(docker inspect "$CONTAINER" --format='{{.Image}}')"
            [ -n "$previous_image" ] || {
              echo "Cannot identify current Staging image."
              exit 1
            }
            docker image inspect "$previous_image" >/dev/null
            docker image tag "$previous_image" "$ROLLBACK_TAG"

            git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"
            latest_sha="$(git rev-parse refs/remotes/origin/develop)"
            [ "$latest_sha" = "$DEPLOY_SHA" ] || {
              echo "Skipping stale deployment; develop has moved."
              exit 0
            }
            git cat-file -e "$DEPLOY_SHA^{commit}"

            echo "Preparing exact tested backend revision: $DEPLOY_SHA"
            git archive "$DEPLOY_SHA" backend | tar -x -C "$BUILD_DIR"
            docker build --tag "$CANDIDATE_TAG" "$BUILD_DIR/backend"
            docker image inspect "$CANDIDATE_TAG" >/dev/null

            check_backend() {
              local runtime_db
              runtime_db="$(docker exec "$CONTAINER" printenv DB_NAME 2>/dev/null || true)"
              [ "$runtime_db" = "$EXPECTED_DB" ] || return 1

              curl --fail --silent --max-time 5 \
                http://127.0.0.1:5000/ready >/dev/null || return 1

              docker exec -i "$CONTAINER" python - "$EXPECTED_DB" <<'PY_DB_CHECK'
            import sys
            from database import get_connection

            expected = sys.argv[1]
            conn = None
            try:
                conn = get_connection()
                if conn is None:
                    raise RuntimeError("Database connection returned None")
                cursor = conn.cursor()
                cursor.execute("SELECT DB_NAME(), state_desc FROM sys.databases WHERE name = DB_NAME()")
                row = cursor.fetchone()
                if row is None or row[0] != expected or row[1] != "ONLINE":
                    raise RuntimeError(f"Unexpected database result: {row!r}")
                print(f"Connected to {row[0]} ({row[1]})")
            finally:
                if conn is not None:
                    conn.close()
            PY_DB_CHECK
            }

            rollback() {
              echo "Rolling back Staging to its previous image..."
              docker image tag "$previous_image" "$IMAGE_TAG"
              docker compose up -d --no-deps --no-build --force-recreate "$SERVICE"
              for i in $(seq 1 18); do
                if check_backend; then
                  echo "Staging rollback verified."
                  return 0
                fi
                sleep 5
              done
              echo "CRITICAL: Staging rollback did not become healthy."
              return 1
            }

            echo "Verifying current Staging service before deployment..."
            check_backend || {
              echo "Current Staging service is unhealthy; refusing deployment."
              exit 1
            }

            docker image tag "$CANDIDATE_TAG" "$IMAGE_TAG"
            if ! docker compose up -d --no-deps --no-build --force-recreate "$SERVICE"; then
              rollback || echo "MANUAL INTERVENTION REQUIRED."
              exit 1
            fi

            ready=0
            for i in $(seq 1 18); do
              if check_backend; then
                ready=1
                break
              fi
              sleep 5
            done

            if [ "$ready" -ne 1 ]; then
              docker compose logs --tail=60 "$SERVICE" || true
              rollback || echo "MANUAL INTERVENTION REQUIRED."
              exit 1
            fi

            new_image="$(docker inspect "$CONTAINER" --format='{{.Image}}')"
            tmp_state="$(mktemp "$STATE_DIR/.staging-state.XXXXXX")"
            {
              printf 'CURRENT_IMAGE=%s\n' "$new_image"
              printf 'CURRENT_COMMIT=%s\n' "$DEPLOY_SHA"
              printf 'CURRENT_ENV=staging\n'
              printf 'PREVIOUS_IMAGE=%s\n' "$previous_image"
            } > "$tmp_state"
            chmod 600 "$tmp_state"
            mv -f "$tmp_state" "$STATE_FILE"

            echo "======================================"
            echo "STAGING DEPLOYMENT SUCCESS"
            echo "Commit: $DEPLOY_SHA"
            echo "Image:  $new_image"
            echo "Database verified: $EXPECTED_DB"
            echo "======================================"
