name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Compile all Python modules
        run: python -m compileall -q backend
      - name: Run backend health tests
        working-directory: backend
        env:
          DEBUG: "false"
        run: python -m unittest discover -s ../tests -p 'test_staging_health.py'
      - name: Run isolated API contracts and invoice regressions
        env:
          DEBUG: "false"
        run: python -m unittest discover -s tests/api -p 'test_[a-z]*.py'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker compose build backend

  api-test:
    runs-on: ubuntu-latest
    needs: [backend, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman
        run: npm install -g newman
      - name: Start backend without production credentials
        run: |
          docker network create football-network
          docker compose up -d --build backend
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Test running API with assertions
        run: newman run tests/postman/staging-smoke.postman_collection.json --env-var baseUrl=http://127.0.0.1:5000
      - name: Stop backend
        if: always()
        run: docker compose down

  deploy-backend:
    name: CD backend after CI succeeds
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [frontend, backend, docker, api-test]
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  sync-frontend:
    name: CD frontend after CI succeeds
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [frontend, backend, docker, api-test]
    uses: ./.github/workflows/sync-frontend.yml
    secrets: inherit
