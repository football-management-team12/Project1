name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main


jobs:

  # =========================================================
  # FRONTEND
  # =========================================================

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # =========================================================
  # BACKEND
  # =========================================================

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check backend
        working-directory: backend
        run: python -m py_compile app.py


  # =========================================================
  # DOCKER
  # =========================================================

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build


  # =========================================================
  # API TEST
  # =========================================================

  api-test:
    runs-on: ubuntu-latest

    needs:
      - backend
      - docker

    env:
      DB_DRIVER: "ODBC Driver 18 for SQL Server"
      DB_SERVER: "127.0.0.1,1433"
      DB_USER: "sa"
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_TRUST_SERVER_CERTIFICATE: "yes"

    services:

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest

        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

        ports:
          - 1433:1433


    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # PYTHON
      # -----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # -----------------------------------------------------
      # NODE
      # Newman + OpenAPI converter cần Node
      # -----------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # -----------------------------------------------------
      # BACKEND DEPENDENCIES
      # -----------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------------------------
      # SQL SERVER ODBC DRIVER
      # -----------------------------------------------------

      - name: Install SQL Server ODBC tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            gnupg \
            unixodbc \
            unixodbc-dev

          curl -sSL -O \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb

          sudo dpkg -i packages-microsoft-prod.deb

          rm packages-microsoft-prod.deb

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            msodbcsql18 \
            mssql-tools18


      # -----------------------------------------------------
      # WAIT SQL SERVER
      # -----------------------------------------------------

      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server..."

          for i in {1..30}; do

            if /opt/mssql-tools18/bin/sqlcmd \
              -S "$DB_SERVER" \
              -U "$DB_USER" \
              -P "$DB_PASSWORD" \
              -C \
              -Q "SELECT 1" \
              > /dev/null 2>&1
            then

              echo "SQL Server is ready"
              exit 0

            fi

            echo "SQL Server is not ready yet..."
            sleep 2

          done

          echo "SQL Server failed to start"
          exit 1


      # -----------------------------------------------------
      # CHECK DATABASE SQL FILE
      # -----------------------------------------------------

      - name: Check database script
        run: |
          if [ ! -f database/SB1.sql ]; then
            echo "database/SB1.sql not found"

            echo "Files inside database/:"
            ls -la database || true

            exit 1
          fi

          echo "database/SB1.sql found"


      # -----------------------------------------------------
      # IMPORT DATABASE
      # -----------------------------------------------------

      - name: Import database
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$DB_SERVER" \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -b \
            -i database/SB1.sql


      # -----------------------------------------------------
      # DETECT DATABASE NAME
      #
      # Fresh SQL Server runner chỉ có system databases +
      # database vừa import nên không cần hard-code DB_NAME.
      # -----------------------------------------------------

      - name: Detect database name
        run: |
          DB_NAME=$(
            /opt/mssql-tools18/bin/sqlcmd \
              -S "$DB_SERVER" \
              -U "$DB_USER" \
              -P "$DB_PASSWORD" \
              -C \
              -h -1 \
              -W \
              -Q "
                SET NOCOUNT ON;

                SELECT TOP 1 [name]
                FROM sys.databases
                WHERE database_id > 4
                ORDER BY database_id DESC;
              " |
            tr -d '\r' |
            xargs
          )

          if [ -z "$DB_NAME" ]; then
            echo "Cannot detect application database"
            exit 1
          fi

          echo "Detected database: $DB_NAME"

          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # SHOW DATABASE INFORMATION
      # -----------------------------------------------------

      - name: Verify imported database
        run: |
          echo "Using database: $DB_NAME"

          /opt/mssql-tools18/bin/sqlcmd \
            -S "$DB_SERVER" \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -d "$DB_NAME" \
            -Q "
              SELECT TABLE_NAME
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_TYPE = 'BASE TABLE'
              ORDER BY TABLE_NAME;
            "


      # -----------------------------------------------------
      # START FLASK BACKEND
      #
      # Không dùng python app.py trực tiếp để tránh Flask
      # debug reloader tạo thêm process trong CI.
      # -----------------------------------------------------

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -c "
          from app import app

          app.run(
              host='0.0.0.0',
              port=5000,
              debug=False,
              use_reloader=False
          )
          " > backend.log 2>&1 &

          echo $! > backend.pid

          echo "Backend process started"


      # -----------------------------------------------------
      # WAIT BACKEND
      # -----------------------------------------------------

      - name: Wait for backend
        run: |
          echo "Waiting for Flask backend..."

          for i in {1..30}; do

            if curl \
              -fsS \
              http://127.0.0.1:5000/api/fields/ \
              > /dev/null
            then

              echo "Backend is ready"
              exit 0

            fi

            echo "Backend is not ready yet..."
            sleep 2

          done

          echo "Backend failed to start"

          echo "========== BACKEND LOG =========="

          cat backend/backend.log || true

          echo "================================="

          exit 1


      # -----------------------------------------------------
      # INSTALL POSTMAN / OPENAPI TOOLS
      # -----------------------------------------------------

      - name: Install Newman and OpenAPI converter
        run: |
          npm install -g \
            newman \
            openapi-to-postmanv2


      # -----------------------------------------------------
      # CHECK SWAGGER FILE
      # -----------------------------------------------------

      - name: Check Swagger file
        run: |
          if [ ! -f backend/swagger.yaml ]; then
            echo "backend/swagger.yaml not found"
            exit 1
          fi

          echo "backend/swagger.yaml found"


      # -----------------------------------------------------
      # SWAGGER -> POSTMAN COLLECTION
      # -----------------------------------------------------

      - name: Convert Swagger to Postman Collection
        run: |
          openapi2postmanv2 \
            -s backend/swagger.yaml \
            -o converted_collection.json \
            -p


      # -----------------------------------------------------
      # NEWMAN API TEST
      # -----------------------------------------------------

      - name: Run API tests
        run: |
          newman run \
            converted_collection.json \
            --reporters cli


      # -----------------------------------------------------
      # DEBUG LOG
      # -----------------------------------------------------

      - name: Show backend log if API test failed
        if: failure()
        run: |
          echo "========== BACKEND LOG =========="

          cat backend/backend.log || true

          echo "================================="