name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check backend
        working-directory: backend
        run: python -m py_compile app.py

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  api-test:
    runs-on: ubuntu-latest
    needs: [backend, docker]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "FootballCI@12345"
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install ODBC Driver
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg unixodbc unixodbc-dev
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install sqlcmd
        run: |
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "FootballCI@12345" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server..."
            sleep 2
          done
          echo "SQL Server failed to start"
          exit 1

      - name: Import database
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "FootballCI@12345" \
            -C \
            -i database/SB1.sql

      - name: Start backend
        working-directory: backend
        env:
          DB_DRIVER: "ODBC Driver 18 for SQL Server"
          DB_SERVER: "127.0.0.1,1433"
          DB_NAME: "FootballBookingDB"
          DB_USER: "sa"
          DB_PASSWORD: "FootballCI@12345"
          DB_TRUST_SERVER_CERTIFICATE: "yes"
        run: |
          python app.py > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/api/fields/ > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend failed to start"
          cat backend/backend.log
          exit 1

      - name: Install Newman and OpenAPI Converter
        run: npm install -g newman openapi-to-postmanv2

      - name: Convert Swagger to Postman Collection
        run: |
          openapi2postmanv2 -s backend/swagger.yaml -o converted_collection.json -p

      - name: Run API tests
        run: |
          newman run converted_collection.json

      - name: Show backend log if failed
        if: failure()
        run: |
          cat backend/backend.log