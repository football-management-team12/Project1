name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check backend
        working-directory: backend
        run: python -m py_compile app.py

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  api-test:
    runs-on: ubuntu-latest
    needs: [backend, docker] # Chờ backend và docker build xong mới chạy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Cài đặt Newman và công cụ chuyển đổi OpenAPI/Swagger
      - name: Install Newman and OpenAPI Converter
        run: npm install -g newman openapi-to-postmanv2

      # 2. Khởi chạy hệ thống bằng Docker Compose
      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          DB_DRIVER=ODBC Driver 18 for SQL Server
          DB_SERVER=football-sql,1433
          DB_NAME=FootballBookingDB
          DB_USER=ci_user
          DB_PASSWORD=ci_dummy_password
          DB_TRUST_SERVER_CERTIFICATE=yes
          EOF

          docker network create football-network || true

      - name: Start Services with Docker
        run: |
          docker network create football-network || true
          docker compose up -d --build
          sleep 10
      # 3. Chuyển đổi backend/swagger.yaml sang Collection & Chạy Test
      - name: Convert Swagger to Postman Collection & Run Tests
        run: |
          openapi2postmanv2 -s backend/swagger.yaml -o converted_collection.json -p
          newman run converted_collection.json

      # 4. Tắt môi trường Docker
      - name: Stop Services
        if: always()
        run: docker compose down
