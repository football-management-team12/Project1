name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify refund evidence downloads
        run: node tests/refund_evidence_download_check.mjs
      - run: npm run build
        working-directory: frontend
      - name: Verify Vercel SPA fallback and built assets
        run: node tests/vercel_spa_routes_check.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Compile all Python modules
        run: python -m compileall -q backend
      - name: Run backend health tests
        working-directory: backend
        env:
          DEBUG: "false"
        run: python -m unittest discover -s ../tests -p 'test_staging_health.py'
      - name: Run isolated API contracts and invoice regressions
        env:
          DEBUG: "false"
        run: python -m unittest discover -s tests/api -p 'test_[a-z]*.py'

  api-test:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman
        run: npm install -g newman
      - name: Build backend Docker image
        run: docker build --tag project1-backend-ci:latest ./backend
      - name: Start backend without production credentials
        run: |
          docker run --detach \
            --name project1-backend-ci \
            --publish 5000:5000 \
            --env DEBUG=false \
            --env APP_HOST=0.0.0.0 \
            --env APP_PORT=5000 \
            --env PORT=5000 \
            project1-backend-ci:latest
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs project1-backend-ci
          exit 1
      - name: Test running API with assertions
        run: newman run tests/postman/staging-smoke.postman_collection.json --env-var baseUrl=http://127.0.0.1:5000
      - name: Stop backend
        if: always()
        run: docker rm --force project1-backend-ci || true

  deploy-staging:
    name: CD Staging backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [frontend, backend, api-test]
    uses: ./.github/workflows/deploy-backend.yml
    with:
      target_environment: staging
    secrets: inherit

  deploy-production:
    name: CD Production backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: [frontend, backend, api-test]
    uses: ./.github/workflows/deploy-backend.yml
    with:
      target_environment: production
    secrets: inherit

  sync-frontend:
    name: CD frontend after CI succeeds
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [frontend]
    uses: ./.github/workflows/sync-frontend.yml
    secrets: inherit
