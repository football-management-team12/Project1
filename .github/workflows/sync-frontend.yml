name: Sync Frontend to Vercel Fork

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sync-frontend-to-vercel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Validate source branch
        id: branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$SOURCE_BRANCH" in
            develop|main) ;;
            *) echo "Unsupported source branch: $SOURCE_BRANCH"; exit 1 ;;
          esac
          echo "target_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Skip outdated CI revisions
        id: latest
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C source fetch origin "$SOURCE_BRANCH"
          latest_sha=$(git -C source rev-parse "origin/$SOURCE_BRANCH")
          if [ "$latest_sha" != "$SOURCE_SHA" ]; then
            echo "Outdated CI run; frontend sync skipped."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout matching Vercel fork branch
        if: steps.latest.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: Thfnh/Deploy
          ref: ${{ steps.branch.outputs.target_branch }}
          token: ${{ secrets.FRONTEND_SYNC_TOKEN }}
          path: fork
          persist-credentials: true

      - name: Validate frontend directories
        if: steps.latest.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "source/frontend/package.json" || {
            echo "ERROR: source/frontend/package.json not found."
            exit 1
          }
          test -d "fork/frontend" || {
            echo "ERROR: fork/frontend does not exist on target branch."
            exit 1
          }

      - name: Sync frontend files only
        if: steps.latest.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -av --delete \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.vercel/' \
            source/frontend/ fork/frontend/

      - name: Commit and push to matching branch if changed
        if: steps.latest.outputs.current == 'true'
        working-directory: fork
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.branch.outputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- frontend
          if git diff --cached --quiet -- frontend; then
            echo "Frontend is already up to date."
            exit 0
          fi
          git commit -m "chore: sync frontend from Project1 $TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
