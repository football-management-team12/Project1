$kind: http-example
name: Dữ liệu không hợp lệ.
request:
  url: "{{baseUrl}}/api/bookings/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "FieldID": 1,
        "BookingDate": "2026-10-05",
        "PriceID": 101,
        "Note": "Cần chuẩn bị sẵn 2 bộ áo lưới"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "nullable": true,
        "example": "?date=2026-10-04"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "Thông tin yêu cầu không hợp lệ"
          },
          "example": {
            "type": "string",
            "example": "?date=2026-10-04"
          }
        }
      }
order: 2000
