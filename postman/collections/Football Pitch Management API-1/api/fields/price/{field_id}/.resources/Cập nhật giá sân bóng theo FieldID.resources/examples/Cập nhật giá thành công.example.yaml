$kind: http-example
request:
  url: "{{baseUrl}}/api/fields/price/:field_id"
  method: PUT
  headers:
    Content-Type: application/json
  pathVariables:
    - key: field_id
      value: "235"
      disabled: false
      description: ID của sân bóng cần cập nhật
  body:
    type: json
    content: |-
      {
        "StartTime": "06:00:00",
        "EndTime": "17:00:00",
        "Price": 200000
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
