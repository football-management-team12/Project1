openapi: "3.0.0"
info:
  title: "Football Pitch Management API"
  description: "Tài liệu API Hệ thống Quản lý Sân bóng"
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:5000"
    description: "Local Server"

paths:
  # ------------------------------------
  # 1. API Authentication (routes/auth.py)
  # ------------------------------------
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: "Đăng ký tài khoản CUSTOMER"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, username, email, phone, password]
              properties:
                fullName: { type: string, example: "Nguyen Van A" }
                username: { type: string, example: "nguyenvana" }
                email: { type: string, format: email, example: "a@example.com" }
                phone: { type: string, example: "0901234567" }
                password: { type: string, format: password, example: "P@ssw0rd" }
      responses:
        '201':
          description: "Đăng ký thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Đăng ký thành công" }
                  user:
                    type: object
                    properties:
                      userId: { type: integer, example: 123 }
                      username: { type: string, example: "nguyenvana" }
                      email: { type: string, example: "a@example.com" }
                      role: { type: string, example: "CUSTOMER" }
        '400': { description: "Dữ liệu JSON không hợp lệ hoặc thiếu trường" }
        '500': { description: "Không thể đăng ký tài khoản" }

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: "Đăng nhập người dùng"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                  description: "Username, email hoặc số điện thoại"
                  example: "nguyenvana"
                email:
                  type: string
                  format: email
                  example: "admin@gmail.com"
                password:
                  type: string
                  format: password
                  example: "123456"
      responses:
        '200':
          description: "Đăng nhập thành công"
        '401':
          description: "Tên đăng nhập hoặc mật khẩu không hợp lệ"
        '400':
          description: "Thiếu trường hoặc account không đúng định dạng"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Vui lòng kiểm tra thông tin đăng nhập" }

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: "Lấy thông tin tài khoản hiện tại qua Auth"
      operationId: getCurrentUserAuth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Lấy thông tin thành công"
        '401':
          description: "Chưa xác thực hoặc Token không hợp lệ"
        '403':
          description: "Tài khoản hiện không hoạt động"
        '404':
          description: "Không tìm thấy người dùng"

  # ------------------------------------
  # 2. API Users (routes/user.py)
  # ------------------------------------
  /api/users/me:
    get:
      tags:
        - Users
      summary: "Lấy thông tin cá nhân của người dùng đang đăng nhập"
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Lấy thông tin cá nhân thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    example: 1
                  fullName:
                    type: string
                    example: "Pham Ngoc Anh"
                  username:
                    type: string
                    example: "ngocanh"
                  email:
                    type: string
                    format: email
                    example: "ngocanh@example.com"
                  phone:
                    type: string
                    example: "0987654321"
                  role:
                    type: string
                    example: "User"
                  status:
                    type: string
                    example: "Active"
        '401':
          description: "Access token thiếu, sai hoặc hết hạn"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token không hợp lệ hoặc đã hết hạn"
        '403':
          description: "Tài khoản không hoạt động"
        '404':
          description: "Không tìm thấy người dùng"
        '500':
          description: "Lỗi server nội bộ"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Không thể tải thông tin cá nhân"

    put:
      tags:
        - Users
      summary: "Cập nhật thông tin cá nhân của người dùng đang đăng nhập"
      operationId: updateMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phone
              properties:
                fullName:
                  type: string
                  example: "Pham Ngoc Anh Updated"
                email:
                  type: string
                  format: email
                  example: "ngocanh.new@example.com"
                phone:
                  type: string
                  example: "0912345678"
      responses:
        '200':
          description: "Cập nhật thông tin thành công"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật thông tin thành công"
                  user:
                    type: object
                    properties:
                      userId: { type: integer, example: 1 }
                      fullName: { type: string, example: "Pham Ngoc Anh Updated" }
                      username: { type: string, example: "ngocanh" }
                      email: { type: string, example: "ngocanh.new@example.com" }
                      phone: { type: string, example: "0912345678" }
                      role: { type: string, example: "User" }
                      status: { type: string, example: "Active" }
        '400':
          description: "Dữ liệu sai hoặc request chứa trường không được phép"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Vui lòng nhập đầy đủ họ tên, email và số điện thoại" }
        '401':
          description: "Access token thiếu, sai hoặc hết hạn"
        '409':
          description: "Email hoặc số điện thoại đã tồn tại"
        '500':
          description: "Lỗi hệ thống khi cập nhật"

  # ------------------------------------
  # 3. API Fields (routes/field.py)
  # ------------------------------------
  /api/fields/:
    get:
      tags:
        - Fields
      summary: "Lấy danh sách tất cả các sân bóng (BE-03)"
      operationId: getFields
      responses:
        '200':
          description: "Lấy danh sách sân bóng thành công."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldWithPrice'
        '500':
          description: "Lỗi máy chủ nội bộ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/fields/price/{field_id}:
    put:
      tags:
        - Fields
      summary: "Cập nhật giá/khung giờ sân bóng"
      operationId: updateFieldPrice
      security:
        - BearerAuth: []
      parameters:
        - name: field_id
          in: path
          required: true
          description: "ID của sân bóng"
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - StartTime
                - EndTime
                - Price
              properties:
                StartTime: { type: string, example: "06:00:00" }
                EndTime: { type: string, example: "07:30:00" }
                Price: { type: number, format: float, example: 300000.0 }
      responses:
        '200':
          description: "Cập nhật giá thành công."
        '400':
          description: "Dữ liệu đầu vào không hợp lệ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Không tìm thấy sân bóng."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------
  # 4. AVAILABILITY ENDPOINTS
  # ------------------------------------
  /api/fields/{field_id}/availability:
    get:
      tags:
        - Availability
      summary: "Kiểm tra lịch trống của một sân bóng theo ngày"
      operationId: getFieldAvailability
      parameters:
        - name: field_id
          in: path
          required: true
          schema: { type: integer, example: 1 }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-26" }
      responses:
        '200':
          description: "Chi tiết lịch trống sân bóng."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleFieldAvailabilityResponse'
        '400':
          description: "Thiếu thông số date hoặc sai định dạng."
        '404':
          description: "Không tìm thấy sân bóng."

  /api/fields/availability:
    get:
      tags:
        - Availability
      summary: "Kiểm tra lịch trống của toàn bộ sân bóng theo ngày"
      operationId: getAllFieldsAvailability
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-10-04" }
      responses:
        '200':
          description: "Lịch trống của toàn bộ sân bóng."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllFieldsAvailabilityResponse'
        '400':
          description: "Thiếu thông số date hoặc sai định dạng."

  # ------------------------------------
  # 5. BOOKING ENDPOINTS
  # ------------------------------------
  /api/bookings/:
    post:
      tags:
        - Booking
      summary: "Tạo lượt đặt sân bóng mới (Booking)"
      operationId: createBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [FieldID, BookingDate, PriceID]
              properties:
                FieldID: { type: integer, example: 1 }
                BookingDate: { type: string, format: date, example: "2026-10-05" }
                PriceID: { type: integer, example: 101 }
                Note: { type: string, example: "Cần chuẩn bị sẵn 2 bộ áo lưới" }
      responses:
        '201':
          description: "Đặt sân thành công."
        '400':
          description: "Dữ liệu không hợp lệ."
        '409':
          description: "Khung giờ đã được người khác đặt."

    get:
      tags:
        - Booking
      summary: "Lấy danh sách lịch đặt sân"
      operationId: getBookings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, example: "CONFIRMED" }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date, example: "2026-10-05" }
      responses:
        '200':
          description: "Danh sách lượt đặt sân."

  /api/bookings/{booking_id}:
    get:
      tags:
        - Booking
      summary: "Lấy thông tin chi tiết của một lượt đặt sân"
      operationId: getBookingById
      security:
        - BearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema: { type: integer, example: 50 }
      responses:
        '200':
          description: "Chi tiết đơn đặt sân."
        '404':
          description: "Không tìm thấy lượt đặt sân."

  /api/bookings/{booking_id}/cancel:
    put:
      tags:
        - Booking
      summary: "Hủy lượt đặt sân"
      operationId: cancelBooking
      security:
        - BearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema: { type: integer, example: 50 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Bận đột xuất không đá được" }
      responses:
        '200':
          description: "Hủy đặt sân thành công."
        '400':
          description: "Không thể hủy lượt đặt sân này."

  /api/user/profile:
    get:
      tags:
        - Users
      summary: "Lấy hồ sơ bằng Bearer token (legacy path)"
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Trả về hồ sơ tài khoản trong token"
        '401':
          description: "Access token thiếu, sai hoặc hết hạn"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PublicUser:
      type: object
      properties:
        userId:
          type: integer
          example: 123
        username:
          type: string
          example: "nguyenvana"
        email:
          type: string
          example: "a@example.com"
        role:
          type: string
          example: "CUSTOMER"
    FieldWithPrice:
      type: object
      properties:
        FieldID: { type: integer, example: 1 }
        FieldName: { type: string, example: "Sân 7 A1" }
        FieldType: { type: string, example: "Sân 7 người" }
        Location: { type: string, example: "Khu A" }
        Image: { type: string, nullable: true, example: "san_a1.jpg" }
        Status: { type: string, example: "AVAILABLE" }
        StartTime: { type: string, example: "06:00:00" }
        EndTime: { type: string, example: "07:30:00" }
        Price: { type: number, format: float, example: 300000.0 }

    Slot:
      type: object
      properties:
        PriceID: { type: integer, example: 101 }
        StartTime: { type: string, example: "06:00:00" }
        EndTime: { type: string, example: "07:30:00" }
        Price: { type: number, format: float, example: 300000.0 }
        available: { type: boolean, example: true }

    SingleFieldAvailabilityResponse:
      type: object
      properties:
        FieldID: { type: integer, example: 1 }
        FieldName: { type: string, example: "Sân 7 A1" }
        Date: { type: string, format: date, example: "2026-09-26" }
        FieldAvailable: { type: boolean, example: true }
        Slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'

    FieldAvailabilityItem:
      type: object
      properties:
        FieldID: { type: integer, example: 1 }
        FieldName: { type: string, example: "Sân 7 A1" }
        Slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'

    AllFieldsAvailabilityResponse:
      type: object
      properties:
        Date: { type: string, format: date, example: "2026-10-04" }
        TotalFields: { type: integer, example: 5 }
        Fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldAvailabilityItem'

    ErrorResponse:
      type: object
      properties:
        message: { type: string, example: "Thông tin yêu cầu không hợp lệ" }
        example: { type: string, nullable: true, example: "?date=2026-10-04" }